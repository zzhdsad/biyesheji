# 开发模式覆盖层：必须与 docker-compose.yml 组合使用（单独使用无效）。
#
# 启动：dev.bat
#   → docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d backend frontend
# 切回：dev-stop.bat
#   → docker compose -f docker-compose.yml up -d backend frontend
#
# 目的：改 backend/src、frontend/src 下的代码即时生效，避免每次改代码都重建镜像。
# 只覆盖命令与挂载，不改任何生产行为；正式发布仍走 build.ps1 构建镜像。
services:
  backend:
    # uvicorn --reload：监听源码变化自动重启
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      # 测试代码也要热更新，否则容器里跑的是镜像内的旧测试
      - ./backend/tests:/app/tests
      # pytest 配置随宿主文件即时生效，改 pyproject.toml 不必重建 10GB 镜像。
      # 只读挂载：跑测试不应反向改动仓库中的配置文件。
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      # 开发/测试的上传文件必须与正式环境分离：正式环境挂载 docker-data/uploads，
      # 开发环境只允许写入 docker-data/uploads_dev，避免清理/覆盖影响正式文件。
      - ${HOST_DATA_DIR:-./docker-data}/uploads_dev:/app/uploads
    # Docker Desktop / VM 重启后自动恢复；仅"手动 stop"才不再拉起（dev-stop.bat 的语义）。
    # 不能用 always：那会让 dev-stop.bat 停掉的容器被反复拉起。
    restart: unless-stopped
    # 停机时可能正在做 Embedding 推理（同步 CPU 密集），默认 10s 宽限期不够，
    # 会被 SIGKILL 变成 Exit 137；给足时间让 uvicorn 优雅退出。
    stop_grace_period: 60s
    healthcheck:
      # 只探测进程存活不够：端口起来但依赖未就绪时也应显示不健康，
      # 便于一眼区分"真的可用"和"反复崩溃但 restart 一直在拉起"。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要加载模型/预热配置，给足冷启动时间，避免误判为不健康
      start_period: 90s
    environment:
      PYTHONUNBUFFERED: "1"
      # 开发环境连接**隔离库** kp_legacy_6f6fa7f，绝不指向主库 knowledge_platform。
      # 该库对应回退版本 6f6fa7f 的旧 Schema（head 7d1e9c4b2a60）；
      # 现有的 kp_dev 保持不动，避免被旧代码读写或迁移。
      # Schema 由 Alembic 管理，启动前需对该库执行：alembic upgrade head
      # 用户名/密码必须与 postgres 服务同源，避免 .env 改了密码而开发后端仍用旧凭据。
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/kp_legacy_6f6fa7f"
      # 向量库同样必须隔离：默认集合 document_chunks 里是生产向量
      # （实测 3518 条），开发/测试往里写会直接污染生产检索结果。
      MILVUS_COLLECTION: "document_chunks_dev"
      # 缓存与对象存储也按环境分开，避免开发写入污染正式缓存/桶
      REDIS_URL: "redis://redis:6379/1"
      MINIO_BUCKET: "documents_dev"

  frontend:
    # next dev：编译按需进行，保存即刷新
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    # 正式镜像里 NODE_ENV=production，与 next dev 冲突会告警，开发模式显式覆盖
    environment:
      NODE_ENV: "development"
      # Windows 上 Docker 绑定挂载不转发 inotify 事件，Next 的 watcher 收不到变更，
      # 会出现「改了源码但页面跑的是旧 bundle」（端到端验收时实测：编译产物里
      # 根本没有新代码，只有重启容器才生效）。开启轮询彻底解决。
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      # 正式镜像最终阶段只保留了 package.json/node_modules/.next，
      # dev 模式需要这些配置才能启动，逐个挂载而不整目录挂载（避免覆盖 node_modules）
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    # 与 backend 保持一致：VM 重启后自动恢复，手动 stop 后不再拉起
    restart: unless-stopped
    healthcheck:
      # next dev 首屏需要现编译，start_period 放宽；用 Node 自带 fetch 探测
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
