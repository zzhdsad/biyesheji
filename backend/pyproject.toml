[project]
name = "knowledge-platform-backend"
version = "0.1.0"
description = "基于 RAG 的企业级智能知识问答平台 - 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.0",
    "alembic>=1.13",
    "redis>=5.0",
    "pymilvus>=2.4,<2.5",
    "setuptools<81",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "minio>=7.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
