name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 测试脚本用 node --test 直接执行 .test.ts，依赖 Node 24 原生 TypeScript 支持
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 10
      - run: npm test
        timeout-minutes: 10
      - run: npm run build
        timeout-minutes: 10

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # CI 不提供 PG / Redis / Milvus 服务：以下地址仅用于隔离标识，
      # 连不上时 conftest 自动降级，数据库集成用例 skip。
      # DATABASE_URL 必须显式指向非主库，安全守卫会拒绝 knowledge_platform。
      ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/kp_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      MILVUS_URI: http://127.0.0.1:19530
      MILVUS_COLLECTION: document_chunks_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        timeout-minutes: 10
      # 不依赖外部 PG / Redis / Milvus 的单元与接口测试；
      # 需要 PostgreSQL 的集成用例在缺少服务时自动 skip。
      - run: python -m pytest tests/test_chunking.py tests/test_parse.py tests/test_batch1_security.py tests/test_health.py -q
        timeout-minutes: 10
