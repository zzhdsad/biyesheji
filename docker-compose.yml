name: biyesheji

services:
  postgres:
    image: postgres:15-alpine
    container_name: kp-postgres
    # 异常退出 / 宿主机重启后自动拉起
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_platform}
    ports:
      - "5432:5432"
    volumes:
      # 绑定到宿主机目录：容器删除 / 重建后数据仍在
      - ${HOST_DATA_DIR:-./docker-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: kp-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: kp-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    ports:
      - "9000:9000"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: kp-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/milvus:/var/lib/milvus

  backend:
    build: ./backend
    container_name: kp-backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      HF_ENDPOINT: https://hf-mirror.com
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANK_MODEL_PATH: /app/models/bge-reranker-v2-m3
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HOST_DATA_DIR: ${HOST_DATA_DIR:-./docker-data}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kp-frontend
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

# 所有业务数据均在 HOST_DATA_DIR（默认 ./docker-data）；不要删除该目录。
