name: biyesheji

services:
  postgres:
    image: postgres:15-alpine
    container_name: kp-postgres
    # 异常退出 / 宿主机重启后自动拉起
    restart: always
    environment:
      # 三项与 backend 的 DATABASE_URL 共用同一来源；缺失时 compose 直接报错，
      # 不再回退到 postgres/postgres 这类弱默认值。
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      # 绑定到宿主机目录：容器删除 / 重建后数据仍在
      - ${HOST_DATA_DIR:-./docker-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: kp-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: kp-minio
    restart: always
    environment:
      # 同一组值同时注入 backend 与 Milvus；MinIO 使用现行 ROOT_* 变量名，
      # 凭据全部来自 .env，compose 内不再保留任何默认密码。
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: minio server /minio_data
    ports:
      - "9000:9000"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: kp-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus 独立用 *_KEY_ID / *_SECRET_ACCESS_KEY 命名；必须与 MinIO 服务一致
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/milvus:/var/lib/milvus

  backend:
    build: ./backend
    container_name: kp-backend
    restart: always
    # 停机时可能正在做 Embedding 推理（同步 CPU 密集），默认 10s 宽限期不够，
    # 会被 SIGKILL 变成 Exit 137；给足时间让 uvicorn 优雅退出。
    stop_grace_period: 60s
    healthcheck:
      # 端口可达但依赖未就绪时也应显示不健康，便于区分"可用"与"反复崩溃被拉起"
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    env_file: .env
    environment:
      # 与 postgres 服务共用同一组 POSTGRES_*：密码含 @ : / ? # % 等保留字符时
      # 需改用 URL 安全字符，否则 URL 解析结果与真实密码不一致。
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      # 容器内必须使用服务名；.env 里的 localhost:9000 只适用于宿主机直跑后端
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      HF_ENDPOINT: https://hf-mirror.com
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANK_MODEL_PATH: /app/models/bge-reranker-v2-m3
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HOST_DATA_DIR: ${HOST_DATA_DIR:-./docker-data}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${HOST_DATA_DIR:-./docker-data}/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: kp-frontend
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

# 所有业务数据均在 HOST_DATA_DIR（默认 ./docker-data）；不要删除该目录。
